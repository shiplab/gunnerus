# Publishes the showcase page in /pages to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy showcase page

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "metadata/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sparse checkout without LFS, so the 1.1 GB of CAD models is never downloaded.
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            pages
            metadata
          sparse-checkout-cone-mode: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages/. _site/
          mkdir -p _site/metadata
          cp metadata/gunnerus_metadata.json _site/metadata/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
